# The container must be set per obs space rather than section-wide: testSubwindows builds its own
# ObsSpaces straight from the obs space configs, bypassing the section-level defaults
# oops::ObsSpaces applies.
time window:
  begin: 2018-04-14T21:00:00Z
  end: 2018-04-15T03:00:00Z
observations:
  observers:
  - obs space:
      use data frame container: true
      name: "AOD"
      simulated variables: ['brightnessTemperature']
      observed variables: ['brightnessTemperature']
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/testinput_tier_1/aod_obs_2018041500_m.nc4
  - obs space:
      use data frame container: true
      name: "AOD VIIRS"
      simulated variables: ['brightnessTemperature']
      observed variables: ['brightnessTemperature']
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/testinput_tier_1/aod_viirs_obs_2018041500_sf42.nc4
  - obs space:
      use data frame container: true
      name: "AMSUA N19"
      simulated variables: ['brightnessTemperature']
      observed variables: ['brightnessTemperature']
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/testinput_tier_1/amsua_n19_obs_2018041500_m.nc4
  - obs space:
      use data frame container: true
      name: "GMI GPM"
      simulated variables: ['brightnessTemperature']
      observed variables: ['brightnessTemperature']
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/testinput_tier_1/gmi_gpm_obs_2018041500_m.nc4
  - obs space:
      use data frame container: true
      name: Radiosonde
      simulated variables: ['airTemperature', 'windEastward']
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/testinput_tier_1/sondes_obs_2018041500_m.nc4

    # Marine obs
