---
row priority:
   column data:
     - name: "MetaData/intVariable"
       type: "int"
       values: [ 1, 2, 3, 4, 5 ]
     - name: "MetaData/floatVariable"
       type: "float"
       values: [ 1.5, 2.5, 3.5, 4.5, 5.5 ]
     - name: "MetaData/stringVariable"
       type: "string"
       values: [ "abc", "def", "ghi", "jkl", "mnopqrst" ]
     - name: "MetaData/int64Variable"
       type: "int64"
       values: [ 10, 20, 30, 40, 50 ]
     - name: "MetaData/charVariable"
       type: "char"
       values: "abcde" # have to read in as string and convert to
                       # vector of char
   tolerance: 1.0e-6

