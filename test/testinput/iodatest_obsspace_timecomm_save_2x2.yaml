---
# Run on 4 MPI tasks: 2 time ranks (subwindows) of 2 tasks each, with an io pool
# of size 2 in each subwindow. Each time rank must write its own output file(s),
# for both the single shared file and the multiple files output.
#
# The container is selected with the IODA_TEST_CONTAINER environment variable on
# the ctest registration. The OSDF run tags the output file names with "_osdf".
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

number of time ranks: 2

observations:
  observers:
  # Single shared file per time rank
  - obs space: &aod_obs_space
      name: "AOD time comm save 2x2 single file"
      simulated variables: ['aerosolOpticalDepth']
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/geos_aod_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/obsspace_timecomm_save_2x2_single.nc4"
      io pool:
        max pool size: 2
    expected output file suffixes: ["_0000", "_0001"]
    unexpected output file suffixes: ["", "_0000_0000", "_0001_0000"]

  # Multiple files: one per io pool rank per time rank, named _<pool rank>_<time rank>
  - obs space:
      <<: *aod_obs_space
      name: "AOD time comm save 2x2 multiple files"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/obsspace_timecomm_save_2x2_multi.nc4"
        write multiple files: true
    expected output file suffixes: ["_0000_0000", "_0001_0000", "_0000_0001", "_0001_0001"]
    unexpected output file suffixes: ["", "_0000", "_0001"]
