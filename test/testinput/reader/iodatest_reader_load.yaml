# Float Channel coordinate. The Channel coordinate in this file is stored as float with
# whole-number values {1,2,3,4}. The reader must register the real coordinate values so the
# per-slice columns are brightnessTemperature_1..4 (Mechanism 1). Before the fix the reader
# ignored non-integer coordinate types and registered synthetic 0-based indices {0,1,2,3},
# producing brightnessTemperature_0..3 -- which is why _0 is listed as a non-column below.
- name: "FloatChannel"
  obsdatain:
    engine:
      type: H5File
      obsfile: "Data/testinput_tier_1/osdf_reader_float_channel.nc4"
  io pool:
    max pool size: 2
  test data:
    non location dimensions:
    - { name: "Channel", numbers: [ 1, 2, 3, 4 ] }
    multi slice vars:
    - { name: "ObsValue/brightnessTemperature", non location dimension: "Channel" }
    number of variables: 1
    sample column names:
    - "sourceLocationIndices"
    - "MetaData/latitude"
    - "MetaData/longitude"
    - "MetaData/dateTime"
    - "ObsValue/brightnessTemperature_1"
    - "ObsValue/brightnessTemperature_4"
    sample non column names:
    # real coordinate values are 1..4, so a synthetic 0-based _0 must NOT exist, nor _5,
    # nor the bare (unexpanded) name
    - "ObsValue/brightnessTemperature_0"
    - "ObsValue/brightnessTemperature_5"
    - "ObsValue/brightnessTemperature"
    sample column units:
    - "MISSING*"
    - "degrees_north"
    - "degrees_east"
    - "seconds since 2018-04-14T21:00:00Z"
    - "K"
    - "K"
    mpi size1:
      rank0:
        pool comm size: 1
        pool comm rank: 0
        nlocs:  4
        nvars:  8
    mpi size2:
      rank0:
        pool comm size: 2
        pool comm rank: 0
        nlocs:  2
        nvars:  8
      rank1:
        pool comm size: 2
        pool comm rank: 1
        nlocs:  2
        nvars:  8
    mpi size4:
      rank0:
        pool comm size: 2
        pool comm rank: 0
        nlocs:  2
        nvars:  8
      rank1:
        pool comm size: 2
        pool comm rank: 0
        nlocs:  0
        nvars:  8
      rank2:
        pool comm size: 2
        pool comm rank: 1
        nlocs:  2
        nvars:  8
      rank3:
        pool comm size: 2
        pool comm rank: 1
        nlocs:  0
        nvars:  8

# Generator backends. These produce synthetic obs data (no input file) on the lead io pool
# rank only, so the rows land on rank 0 and the column metadata is distributed to the other
# ranks (nlocs 0, but nvars matches). The generated columns are all dimensioned by Location:
# MetaData/{latitude,longitude,dateTime}, ObsError/<var>, ObsValue/<var>, sourceLocationIndices.
- name: "GenList"
  obsdatain:
    engine:
      type: GenList
      lats: [ 10.0, 20.0, 30.0, 40.0 ]
      lons: [ 100.0, 110.0, 120.0, 130.0 ]
      dateTimes: [ 0, 900, 1800, 2700 ]
      epoch: "seconds since 2018-04-14T21:00:00Z"
      obs values: [ 280.0 ]
      obs errors: [ 1.0 ]
  io pool:
    max pool size: 1
  simulated variables: [ airTemperature ]
  test data:
    sample column names:
    - "sourceLocationIndices"
    - "MetaData/latitude"
    - "MetaData/longitude"
    - "MetaData/dateTime"
    - "ObsError/airTemperature"
    - "ObsValue/airTemperature"
    sample non column names:
    - "MetaData/pressure"
    - "MetaData/height"
    - "ObsValue/wrongVariable"
    sample column units:
    - "MISSING*"
    - "degrees_north"
    - "degrees_east"
    - "seconds since 2018-04-14T21:00:00Z"
    - "MISSING*"
    - "MISSING*"
    number of variables: 1
    mpi size1:
      rank0:
        nlocs:  4
        nvars:  6
    mpi size2:
      rank0:
        nlocs:  4
        nvars:  6
      rank1:
        nlocs:  0
        nvars:  6
    mpi size4:
      rank0:
        nlocs:  4
        nvars:  6
      rank1:
        nlocs:  0
        nvars:  6
      rank2:
        nlocs:  0
        nvars:  6
      rank3:
        nlocs:  0
        nvars:  6

- name: "GenRandom"
  obsdatain:
