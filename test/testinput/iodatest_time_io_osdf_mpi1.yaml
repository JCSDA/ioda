---
time window:
  begin: "2018-01-01T00:00:00Z"
  end: "2022-01-01T00:00:00Z"

observations:
  # testing the default obs data container setting (OSDF)
  # ie, without "obs data container" the individual obs space would default
  # to ObsGroup
  obs data container: OSDF
  # This file and iodatest_time_io.yaml cover the same five obs spaces with the two
  # containers, and every obs space is checked against one shared reference file, so the
  # containers are compared against each other. The files are not line-for-line twins:
  # this one pins the Identity distribution and sets io pool sizes, and the output file
  # names carry an _osdf_mpi1 tag so the two runs do not collide.
  observers:
  - obs space:
      name: "AMSUA NOAA19"
      distribution:
        name: "Identity"
      simulated variables: ['brightnessTemperature']
      channels: 1-15
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/amsua_n19_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/amsua_n19_obs_2018041500_m_time_osdf_mpi1.nc4"

  - obs space:
      name: "GMI GPM"
      distribution:
        name: "Identity"
      simulated variables: ['brightnessTemperature']
      channels: 1-13
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/gmi_gpm_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/gmi_gpm_obs_2018041500_m_time_osdf_mpi1.nc4"

  - obs space:
      name: "Radiosonde"
      distribution:
        name: "Identity"
      simulated variables: ['airTemperature']
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/sondes_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/sondes_obs_2018041500_m_time_osdf_mpi1.nc4"
      io pool:
        max pool size: 2

  - obs space:
      name: "MultiDim"
      distribution:
        name: "Identity"
      simulated variables: ['brightnessTemperature']
      channels: 1,3,6
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/multidim_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/multidim_obs_2018041500_m_time_osdf_mpi1.nc4"
      io pool:
        max pool size: 2

  - obs space:
      name: "GNSSRO"
      distribution:
        name: "Identity"
      simulated variables: [ 'atmosphericRefractivity', 'bendingAngle' ]
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/gnssro_obs_2021080606_s.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/gnssro_obs_2021080606_s_time_osdf_mpi1.nc4"
