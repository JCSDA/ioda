---

test cases:
  - name: "5 columns"
    osdf columns:
    - name: "MetaData/intVariable"
      type: "int"
      units: "intUnits"
    - name: "MetaData/floatVariable"
      type: "float"
      units: "floatUnits"
    - name: "MetaData/stringVariable"
      type: "string"
      units: "stringUnits"
    - name: "MetaData/int64Variable"
      type: "int64"
      units: "int64Units"
    - name: "MetaData/charVariable"
      type: "char"
      units: "charUnits"
    expected values:
      buffer size: 192
      bytes written: 291
  - name: "7 columns"
    osdf columns:
    - name: "MetaData/intVariable"
      type: "int"
      units: "intUnits"
    - name: "MetaData/floatVariable"
      type: "float"
      units: "floatUnits"
    - name: "MetaData/stringVariable"
      type: "string"
      units: "stringUnits"
    - name: "MetaData/int64Variable"
      type: "int64"
      units: "int64Units"
    - name: "MetaData/charVariable"
      type: "char"
      units: "charUnits"
    - name: "MetaData/anotherIntVariable"
      type: "int"
      units: "intUnits"
    - name: "MetaData/anotherFloatVariable"
      type: "float"
      units: "floatUnits"
    expected values:
