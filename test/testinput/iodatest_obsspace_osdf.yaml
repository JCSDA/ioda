---
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

# note that the test_ioda_obsspace code currently depends on specifying
# ALL of the channels in the "obs space.channels" spec.
observations:
- obs space:
    name: "Contrived data with channels for OSDF"
    simulated variables: ['brightnessTemperature']
    channels: 1-5
    distribution:
      name: Identity
    obsdatain:
      engine:
        type: H5File
        obsfile: "Data/testinput_tier_1/obsspace_osdf.nc4"
    obs perturbations seed: 250
    use data frame container: true
  test data:
    gnlocs: 10
    gnlocs outside time window: 0
    gnlocs rejected by qc: 0
    nlocs from source: 10
    nrecs: 10
    obs perturbations seed: 250
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    variables for get test:
      - name: "latitude"
        group: "MetaData"
        type: "float"
        norm: 220.63840138949399

      - name: "longitude"
        group: "MetaData"
        type: "float"
        norm: 394.92537024564496

      - name: "sourceLocationIndices"
        group: ""
        type: "integer"
        norm: 16.881943016134134

      - name: "brightnessTemperature_1"
        group: "ObsValue"
        type: "float"
        norm: 645.1201438491903

      - name: "brightnessTemperature_2"
        group: "ObsValue"
        type: "float"
        norm: 643.57206278706656

      - name: "brightnessTemperature_3"
        group: "ObsValue"
        type: "float"
        norm: 646.73410301297702
    tolerance:
      - 1.0e-11
    variables for putget test:
      # have to use float variables, and only one channel at a time
      - name: "brightnessTemperature"
        group: "ObsValue"
        channels: [ 4 ]

      - name: "brightnessTemperature"
        group: "ObsValue"
        channels: [ 5 ]

