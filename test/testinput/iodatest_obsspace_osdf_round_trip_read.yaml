---
# Stage 2 of the OSDF round trip test. Read back the file written by
# iodatest_obsspace_osdf_round_trip_write.yaml, which is OSDF output, into an OSDF container.
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

observations:
- obs space:
    name: "OSDF round trip, read"
    simulated variables: ['int_var']
    observed variables: ['int_var']
    use data frame container: true
    obsdatain:
      engine:
        type: H5File
        obsfile: "testoutput/osdf_round_trip.nc4"
    obsdataout:
      engine:
        type: H5File
        obsfile: "testoutput/osdf_round_trip_2.nc4"
  test data:
    gnlocs: 5
    gnlocs outside time window: 0
    gnlocs rejected by qc: 0
    nlocs from source: 5
    nrecs: 5
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    variables for get test:
      # Written by the stage 1 run as NC_BYTE. Values alternate starting with true.
      - name: "DummyBoolVar"
        group: "MetaData"
        type: "bool"
        first value: true
        last value: true

      - name: "int64_var"
        group: "NoFillValue"
        type: "integer_64"
        norm: 74.16198487095663
    tolerance:
      - 1.0e-14
    variables for putget test: []
