---
time window:
  begin: "2018-01-01T00:00:00Z"
  end: "2022-01-01T00:00:00Z"

observations:
  # This file is the ObsGroup half of a two-container parity pair; iodatest_time_io_osdf_mpi1.yaml
  # is the OSDF half, and the two are checked against the same reference files.
  #
  # Precedence rule owned by this file: a section-level "obs data container" overrides the
  # "use data frame container" parameter default. Keep the setting here rather than on the
  # individual obs spaces, so the rule still has a test once the default becomes OSDF.
  obs data container: ObsGroup
  observers:
  - obs space:
      name: "AMSUA NOAA19"
      simulated variables: ['brightnessTemperature']
      channels: 1-15
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/amsua_n19_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/amsua_n19_obs_2018041500_m_time.nc4"

  - obs space:
      name: "Radiosonde"
      simulated variables: ['airTemperature']
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/sondes_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/sondes_obs_2018041500_m_time.nc4"

  - obs space:
      name: "GNSSRO"
      simulated variables: [ 'atmosphericRefractivity', 'bendingAngle' ]
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/gnssro_obs_2021080606_s.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/gnssro_obs_2021080606_s_time.nc4"

  # GMI GPM and MultiDim are also covered by ioda_time_io_osdf_mpi1 with the OSDF container.
  # Both runs are checked against the same reference file, so the two containers are compared
  # against each other for these two obs spaces.
  - obs space:
      name: "GMI GPM"
      simulated variables: ['brightnessTemperature']
      channels: 1-13
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/gmi_gpm_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/gmi_gpm_obs_2018041500_m_time.nc4"

  - obs space:
      name: "MultiDim"
      simulated variables: ['brightnessTemperature']
      channels: 1,3,6
      obsdatain:
        engine:
          type: H5File
          obsfile: "Data/testinput_tier_1/multidim_obs_2018041500_m.nc4"
      obsdataout:
        engine:
          type: H5File
          obsfile: "testoutput/multidim_obs_2018041500_m_time.nc4"
