---
# surface-tcbogus.odb has a mixture of valid and NULL receipt_date/receipt_time values.
# The NULLs must be written back out as NULL rather than as a corrupted date.
time window:
  begin: "2018-08-13T21:00:00Z"
  end: "2018-08-16T03:00:00Z"

observations:
  observers:
  - obs space:
      name: "Surface"
      use data frame container: false
      simulated variables: [stationPressure]
      obsdatain:
        engine:
          type: ODB
          obsfile: "Data/testinput_tier_1/surface-tcbogus.odb"
          mapping file: ../share/test/testinput/odb_surface_name_map.yaml
          query file: ../share/test/testinput/iodatest_odb_surface.yaml
      obsdataout:
        engine:
          type: ODB
          obsfile: "testoutput/odb_missing_receipt_datetime.odb"
          mapping file: ../share/test/testinput/odb_surface_name_map.yaml
          query file: ../share/test/testinput/iodatest_odb_surface.yaml
  - obs space:
      name: "Surface OSDF"
      use data frame container: true
      simulated variables: [stationPressure]
      obsdatain:
        engine:
          type: ODB
          obsfile: "Data/testinput_tier_1/surface-tcbogus.odb"
          mapping file: ../share/test/testinput/odb_surface_name_map.yaml
          query file: ../share/test/testinput/iodatest_odb_surface.yaml
      obsdataout:
        engine:
          type: ODB
          obsfile: "testoutput/odb_missing_receipt_datetime_osdf.odb"
          mapping file: ../share/test/testinput/odb_surface_name_map.yaml
          query file: ../share/test/testinput/iodatest_odb_surface.yaml
