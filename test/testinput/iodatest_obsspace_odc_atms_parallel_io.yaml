---
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

observations:
- obs space: &atms_spread_1_space
    name: ATMS, frame distribution spread 1
    simulated variables: [brightnessTemperature]
    channels: 1-22
    obsdatain:
      engine:
        type: ODB
        obsfile: "Data/testinput_tier_1/atms-variable-sized-frames.odb"
        mapping file: ../share/test/testinput/odb_default_name_map.yaml
        query file: ../share/test/testinput/iodatest_odb_atms.yaml
        frame distribution spread: 1
    distribution:
      name: Identity
    io pool:
      reader name: NonoverlappingPool
  test data: &atms_spread_1_test_data
    gnlocs: 68
    gnlocs outside time window: 32
    gnlocs rejected by qc: 0
    nlocs from source: 100
    nrecs: 68
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    variables for get test:
      - name: "latitude"
        group: "MetaData"
        type: "float"
        norm: 528.87376603209805

      - name: "longitude"
        group: "MetaData"
        type: "float"
        norm: 709.35601984373704

      - name: "brightnessTemperature_4"
        group: "ObsValue"
        type: "float"
        norm: 1994.1529123901557
    tolerance:
      - 1.0e-7
    variables for putget test: []

- obs space:
    <<: *atms_spread_1_space
    name: "ATMS, frame distribution spread 1 (OSDF)"
    distribution:
      name: Identity
    use data frame container: true
  test data: *atms_spread_1_test_data

