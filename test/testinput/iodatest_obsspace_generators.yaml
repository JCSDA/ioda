---
# ObsSpace-level test for the generator backends (GenList, GenRandom).
#
# Registered once per container, the second run selected by IODA_TEST_CONTAINER, so both
# readers are held to these same expectations. Its main purpose is to confirm that
# generator output is NOT time-window filtered: a generator is handed the locations to
# produce, so all of them are kept even when their datetimes fall outside the window.
# GenList is given obs on both sides of the window to pin that down.
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

observations:
# ----------------------------------------------------------------------------------------
# GenList: 6 generated locations, 2 of which fall outside the 6-hour (21600 s) window.
# All 6 are retained by both containers: the location checks do not apply to a generated
# source.
- obs space:
    name: "GenList"
    simulated variables: ['temperature']
    observed variables: ['temperature']
    obsdatain:
      engine:
        type: GenList
        lats:      [  1.0,   2.0,   4.0,  10.0,  50.0,  60.0 ]
        lons:      [  2.0,   4.0,   8.0,  20.0, 100.0, 110.0 ]
        # time offsets (s) relative to the epoch (= window start). The last two are outside
        # the window: one is 1 hour past the end (25200 s > 21600 s), one is 1 hour before
        # the start (-3600 s). Both are kept regardless.
        dateTimes: [ 3600,  7200, 10800, 14400, 25200, -3600 ]
        epoch: "seconds since 2018-04-14T21:00:00Z"
        obs values: [ 285.0 ]
        obs errors: [   1.5 ]
    obs perturbations seed: 0
  test data:
    # 6 generated, none filtered -> all 6 retained.
    gnlocs: 6
    gnlocs outside time window: 0
    gnlocs rejected by qc: 0
    nlocs from source: 6
    nrecs: 6
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    # Norms are over all 6 generated locations, in-window or not:
    #   latitude  {1,2,4,10,50,60}    -> sqrt(6221)
    #   longitude {2,4,8,20,100,110}  -> sqrt(22584)
    #   ObsValue/temperature is constant 285 -> sqrt(6*285^2) = 285*sqrt(6)
    #   ObsError/temperature is constant 1.5 -> sqrt(6*1.5^2) = 1.5*sqrt(6)
    variables for get test:
      - name: "latitude"
        group: "MetaData"
        type: "float"
        norm: 78.873316146844
      - name: "longitude"
        group: "MetaData"
        type: "float"
        norm: 150.27973915335
      - name: "temperature"
        group: "ObsValue"
        type: "float"
        norm: 698.10457669321
      - name: "temperature"
        group: "ObsError"
        type: "float"
        norm: 3.6742346141748
    tolerance:
      - 1.0e-11
    variables for putget test: []

# ----------------------------------------------------------------------------------------
# GenRandom: 9 generated locations. Its datetimes are generated inside the window anyway,
# so this case would look the same either way; it is here to cover the second generator.
- obs space:
    name: "GenRandom"
    simulated variables: ['temperature']
    observed variables: ['temperature']
    obsdatain:
      engine:
        type: GenRandom
        nobs: 9
        lat1:  -90.0
        lat2:   90.0
        lon1: -180.0
        lon2:  180.0
        random seed: 29837
        obs values: [ 285.0 ]
        obs errors: [   1.5 ]
    obs perturbations seed: 0
  test data:
    # None filtered.
    gnlocs: 9
    gnlocs outside time window: 0
    gnlocs rejected by qc: 0
    nlocs from source: 9
    nrecs: 9
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    # latitude/longitude are random, so only the constant obs value/error are checked:
    #   ObsValue/temperature constant 285 -> sqrt(9*285^2) = 3*285 = 855
    #   ObsError/temperature constant 1.5 -> sqrt(9*1.5^2) = 3*1.5 = 4.5
    variables for get test:
      - name: "temperature"
        group: "ObsValue"
        type: "float"
        norm: 855.0
      - name: "temperature"
        group: "ObsError"
        type: "float"
        norm: 4.5
    tolerance:
      - 1.0e-11
    variables for putget test: []
