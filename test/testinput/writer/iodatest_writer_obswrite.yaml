        - name: "MetaData/longitude"
          type: float
          values: [100.0, 110.0, 120.0, 130.0 ]
        - name: "ObsValue/brightnessTemperature_1"
          type: float
          values: [270.0, 273.0, 276.0, 279.0 ]
        - name: "ObsValue/brightnessTemperature_3"
          type: float
          values: [271.0, 274.0, 277.0, 280.0 ]
        - name: "ObsValue/brightnessTemperature_6"
          type: float
          values: [missing, 275.0, 278.0, 281.0 ]
        - name: "MetaData/chanCentralFrequency_1"
          type: float
          values: [1.0e9, 1.0e9, 1.0e9, 1.0e9]
        - name: "MetaData/chanCentralFrequency_3"
          type: float
          values: [3.0e9, 3.0e9, 3.0e9, 3.0e9]
        - name: "MetaData/chanCentralFrequency_6"
          type: float
          values: [6.0e9, 6.0e9, 6.0e9, 6.0e9]
        - name: "Diagnostics/BadValueFlags/flags"
          type: int
          values: [1, 2, 3, 4]
        - name: "Diagnostics/QcFlags/Missing/flags"
          type: int
          values: [0, 0, 0, 0]
        - name: "Diagnostics/QcFlags/InflateError/flags"
