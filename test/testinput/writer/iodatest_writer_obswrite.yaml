        - name: "MetaData/longitude"
          type: float
          values: [140.0, 150.0, 160.0, 170.0, 180.0, 190.0]
        - name: "ObsValue/brightnessTemperature_1"
          type: float
          values: [282.0, 285.0, 288.0, 291.0, 294.0, missing]
        - name: "ObsValue/brightnessTemperature_3"
          type: float
          values: [283.0, 286.0, 289.0, 292.0, 295.0, 298.0]
        - name: "ObsValue/brightnessTemperature_6"
          type: float
          values: [284.0, 287.0, 290.0, 293.0, 296.0, 299.0]
        - name: "MetaData/chanCentralFrequency_1"
          type: float
          values: [1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9]
        - name: "MetaData/chanCentralFrequency_3"
          type: float
