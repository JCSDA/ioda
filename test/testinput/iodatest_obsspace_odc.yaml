---
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

observations:
- obs space: &aircraft_space
    name: "Aircraft"
    simulated variables: ['airTemperature']
    obsdatain:
      engine:
        type: ODB
        obsfile: "Data/testinput_tier_1/aircraft.odb"
        mapping file: ../share/test/testinput/odb_default_name_map.yaml
        query file: ../share/test/testinput/iodatest_odb_aircraft.yaml
  test data: &aircraft_test_data
    gnlocs: 157
    gnlocs outside time window: 43
    gnlocs rejected by qc: 0
    nlocs from source: 200
    nrecs: 157
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    variables for get test:
      - name: "latitude"
        group: "MetaData"
        type: "float"
        norm: 516.381719370864

      - name: "longitude"
        group: "MetaData"
        type: "float"
        norm: 1077.97295968985

      - name: "airTemperature"
        group: "ObsValue"
        type: "float"
        norm: 2976.96363204444
    tolerance:
      - 1.0e-7
    variables for putget test: []
- obs space:
    <<: *aircraft_space
    name: "Aircraft (OSDF)"
    distribution:
      name: Identity
    use data frame container: true
  test data: *aircraft_test_data
- obs space: &aod_space
    name: "AOD"
    simulated variables: ['aerosolOpticalDepth']
    obsdatain:
      engine:
        type: ODB
        obsfile: "Data/testinput_tier_1/aod.odb"
        mapping file: ../share/test/testinput/odb_default_name_map.yaml
        query file: ../share/test/testinput/iodatest_odb_aod.yaml
  test data: &aod_test_data
    gnlocs: 100
    gnlocs outside time window: 0
    gnlocs rejected by qc: 0
    nlocs from source: 100
    nrecs: 100
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    variables for get test:
      - name: "latitude"
        group: "MetaData"
        type: "float"
        norm: 250.7815912522764

      - name: "longitude"
        group: "MetaData"
        type: "float"
        norm: 1114.1838672068625

      - name: "aerosolOpticalDepth"
        group: "ObsValue"
        type: "float"
        norm: 0.8028991220042816

      # Tests missing value conversion
      - name: "aerosol_small_mode_fraction"
        group: "MetaData"
        type: "float"
        norm: 2.7110145727893036

    tolerance:
      - 1.0e-7
    variables for putget test: []

- obs space:
    <<: *aod_space
    name: "AOD (OSDF)"
    distribution:
      name: Identity
    use data frame container: true
  test data: *aod_test_data
