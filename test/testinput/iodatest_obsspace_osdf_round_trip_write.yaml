---
# Stage 1 of the OSDF round trip test. Load a file into an OSDF container and write it
# back out. Stage 2, in iodatest_obsspace_osdf_round_trip_read.yaml, reads this output
# back into an OSDF container.
#
# The container is selected here rather than through IODA_TEST_CONTAINER so that the pair runs
# as OSDF regardless of the environment, and so that stage 2 is allowed to read this output.
time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2018-04-15T03:00:00Z"

observations:
- obs space:
    name: "OSDF round trip, write"
    simulated variables: ['int_var']
    observed variables: ['int_var']
    use data frame container: true
    obsdatain:
      engine:
        type: H5File
        obsfile: "Data/testinput_tier_1/default_fill_values.nc4"
    obsdataout:
      engine:
        type: H5File
        obsfile: "testoutput/osdf_round_trip.nc4"
  test data:
    gnlocs: 5
    gnlocs outside time window: 0
    gnlocs rejected by qc: 0
    nlocs from source: 5
    nrecs: 5
    obs perturbations seed: 0
    expected group variables: []
    expected sort variable: ""
    expected sort order: "ascending"
    variables for get test: []
    tolerance:
      - 1.0e-14
    variables for putget test: []
